<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight School Tool</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>✈️ Flight School Tool</h1>

        <p class="subtitle">
            Check if conditions meet your training limits.
        </p>

        <div class="card">

            <label>Airport ICAO</label>
            <input
                id="airport"
                type="text"
                placeholder="CYTZ"
                value="CYQM"
            />

            <label>Student Category</label>

            <select id="category">
                <option value="white">White</option>
                <option value="green">Green</option>
                <option value="yellow">Yellow</option>
            </select>

            <button id="checkBtn">
                Check Flight
            </button>

        </div>

        <div id="loading"></div>

        <div id="results"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
